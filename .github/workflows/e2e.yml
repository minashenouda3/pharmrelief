name: End-to-end tests
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm i -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Wait for Netlify deploy to settle
        run: sleep 45

      - name: Run suite
        env:
          BASE_URL: https://pharmrelief.ca
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          PHARMACY_EMAIL: ${{ secrets.PHARMACY_EMAIL }}
          PHARMACY_PASSWORD: ${{ secrets.PHARMACY_PASSWORD }}
          PHARMACIST_EMAIL: ${{ secrets.PHARMACIST_EMAIL }}
          PHARMACIST_PASSWORD: ${{ secrets.PHARMACIST_PASSWORD }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
